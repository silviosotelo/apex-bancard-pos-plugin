<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Demo Oracle APEX Bancard POS Plugin</title>
<desc id="desc">Interfaz de cobro Oracle APEX conectada a un terminal Bancard SmartPOS simulado.</desc>
